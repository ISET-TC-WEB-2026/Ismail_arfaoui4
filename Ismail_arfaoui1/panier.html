<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantStore - Mon Panier</title>
    <link rel="icon" href="img/TREES.jpg" type="image/x-icon">
    <link rel="stylesheet" href="css/S.css">
</head>
<body>

    <header id="PlantStore">
        <h1>PlantStore</h1>
        <nav>
            <ul>
                <li><a href="accueil.html">Accueil</a></li>
                <li><a href="catalogue.html">Catalogue</a></li>
                <li><a href="panier.html">Panier</a></li>
                <li><a href="commande.html">Commande</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="cart-container">
            <h2>Mon Panier d'Achat</h2>
            
            <!-- Les éléments dynamiques seront insérés ici via JavaScript -->
            <div id="cart-items">
                <!-- Structure d'un produit dans le panier -->
                <div class="cart-item" style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px; background: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <img src="img/planet.jpg" alt="Monstera Deliciosa" width="80" height="60" style="object-fit: cover; border-radius: 4px;">
                    <div class="item-details" style="flex: 1;">
                        <h3>Monstera Deliciosa</h3>
                        <p class="price" style="margin: 0;">25 DT</p>
                    </div>
                    <div class="item-quantity">
                        <input type="number" value="1" min="1" style="width: 50px; padding: 5px; border-radius: 4px; border: 1px solid #cbd5e1;">
                    </div>
                    <button class="btn" style="background-color: #dc2626; margin-top: 0;">Supprimer</button>
                </div>
            </div>

            <!-- Zone des Totaux -->
            <div class="cart-summary" style="background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 20px;">
                <p>Sous-total : <span id="cart-subtotal">25</span> DT</p>
                <p><strong>Total : <span id="cart-total">25</span> DT</strong></p>
                <a href="commande.html" class="btn">Passer la commande</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PlantStore. Tous droits réservés.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
